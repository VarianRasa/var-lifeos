name: var_app
description: "Var — a calendar-centric productivity app. Every day is a canvas for tasks, kanban, plans, notes, habits, and goals."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  window_manager: ^0.4.3

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

  # Local database
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1

  # Encryption for portable backup
  cryptography: ^2.7.0

  # Persistence — federated, supports all platforms incl. web
  shared_preferences: ^2.3.4

  # HTTP for sync layer
  http: ^1.2.2
  html: ^0.15.6
  crypto: ^3.0.6
  youtube_explode_dart: ^2.3.6
  path_provider: ^2.1.6
  path: ^1.9.1
  url_launcher: ^6.3.2
  web: ^1.1.1
  flutter_local_notifications: 22.0.1
  timezone: 0.11.0
  flutter_timezone: 5.0.2
  firebase_storage: ^13.4.5
  file_picker: ^11.0.2
  video_player: ^2.11.1
  flutter_markdown_plus: 1.0.12
  just_audio: ^0.10.6
  record: ^6.2.1
  just_audio_media_kit: ^2.1.0
  geolocator: ^14.0.2
  health: ^13.3.1
  permission_handler: ^12.0.3
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  encrypt: ^5.0.3
  pdf: ^3.11.2
  sqlite3: ^3.5.0
  sqlite3_web: ^0.9.4

dependency_overrides:
  # ponytail: Remove pin after media_kit publishes hot-restart fix from #1340.
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: b29d407a4e3990dde2b35b152920383a11076b03
      path: media_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_lints: ^6.0.0

  # Test utilities
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/sounds/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
    - family: Fustat
      fonts:
        - asset: assets/fonts/Fustat-Variable.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: PlaywriteUSTrad
      fonts:
        - asset: assets/fonts/PlaywriteUSTrad-Variable.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: AlbertSans
      fonts:
        - asset: assets/fonts/AlbertSans-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
