name: var_app
description: "Var — a calendar-centric productivity app. Every day is a canvas for tasks, kanban, plans, notes, habits, and goals."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

  # Local database
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1

  # Encryption for portable backup
  cryptography: ^2.7.0

  # Persistence — federated, supports all platforms incl. web
  shared_preferences: ^2.3.4

  # HTTP for sync layer
  http: ^1.2.2
  path_provider: ^2.1.6
  path: ^1.9.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_lints: ^6.0.0

  # Test utilities
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true

  fonts:
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
